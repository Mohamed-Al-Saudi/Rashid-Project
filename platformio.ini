[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

; Start with camera capture and decision logic only.
; Add a model/runtime dependency only after confirming the exact board
; and the model's memory requirements.
build_flags =
    -DCORE_DEBUG_LEVEL=3

; If your board is not the common AI-Thinker ESP32-CAM, update the board
; and camera pin mapping before uploading.
